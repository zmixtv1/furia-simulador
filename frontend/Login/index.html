<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Entrar – FURIA Fan Platform</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <img src="https://upload.wikimedia.org/wikipedia/pt/f/f9/Furia_Esports_logo.png" alt="FURIA" class="header-logo">
    <nav>
      <a href="/frontend/Home/index.html">CHAT</a>
      <a href="/frontend/cadastro/index.html">CADASTRAR</a>
      <a href="/frontend/Login/index.html">LOGIN</a>
    </nav>
  </header>

  <!-- SPLIT: apenas painel esquerdo com login -->
  <section class="split-container">
    <div class="panel panel-left">
      <div class="panel-content" id="signin-form">
        <h2>Bem-vindo de volta!</h2>
        <p>Use suas credenciais para acessar sua conta de fã.</p>
        <form id="login-form">
          <input type="text" placeholder="Nome de usuário" required>
          <input type="password" placeholder="Senha" required>
          <button type="submit" class="btn-primary">ENTRAR</button>
        </form>
        <p class="small">
          Ainda não tem conta? <a href="/frontend/cadastro/index.html">Cadastre-se</a>
        </p>
      </div>
    </div>
    <!-- opcional: painel direito pode ficar em branco ou com algum gráfico/arte -->
    <div class="panel panel-right">
      <div class="panel-content">
        <h2>FURIA Fan Platform</h2>
        <p>Conecte-se com a nossa comunidade e fique por dentro de tudo!</p>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="site-footer">
    <p>© 2024 FURIA Esports • Desenvolvido por Alaor</p>
  </footer>

</body>
</html>
