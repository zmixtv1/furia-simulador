<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Simulador de Torcida da FURIA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="main-container">

    <!-- Card esquerdo: simulador -->
    <div class="card simulador">
      <img src="https://upload.wikimedia.org/wikipedia/pt/f/f9/Furia_Esports_logo.png"
           class="logo" alt="Logo FURIA">
      <h1>🔥 ChatBot da FURIA 🔥</h1>

      <ul id="mensagens" class="chat-list">
        <!-- Mensagens do simulador -->
      </ul>

      <form id="formulario" class="chat-form">
        <input type="text" id="entrada" placeholder="Digite sua mensagem">
        <button type="submit">Enviar</button>
      </form>

      <div class="placar-box">
        <p><strong>Verificar se tem jogo</strong></p>
        <button id="btn-verificar">OK</button>
        <!-- elemento necessário para o JS não falhar -->
        <p id="placar">Aguardando verificação...</p>
      </div>
    </div>

    <!-- Card direito: transmissão + chat -->
    <div class="card transmissao-chat">

      <div class="live-box">
        <p class="live-label">LIVE</p>
        <iframe
          src="https://player.twitch.tv/?channel=gaules&parent=127.0.0.1"
          frameborder="0" allowfullscreen
          height="300" width="100%">
        </iframe>
      </div>

      <div class="nickname-box">
        <input type="text" id="nickname-input" placeholder="Escolha seu apelido">
        <button id="nickname-submit">OK</button>
      </div>

      <h3>💬 Chat da Torcida (ao vivo)</h3>
      <ul id="chat-publico" class="chat-list"></ul>

      <form id="chat-form" class="chat-form">
        <input type="text" id="mensagem" placeholder="Fale com outros torcedores">
        <button type="submit">Enviar</button>
      </form>

    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
